<!-- Originally from https://github.com/tauri-apps/wry/blob/dev/examples/custom_titlebar.rs -->

<html>

<head>
    <style>
        html {
            font-family: Inter, Avenir, Helvetica, Arial, sans-serif;
        }

        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        main {
            display: grid;
            place-items: center;
            height: calc(100vh - 30px);
        }

        .titlebar {
            height: 30px;
            padding-left: 5px;
            display: grid;
            grid-auto-flow: column;
            grid-template-columns: 1fr max-content max-content max-content;
            align-items: center;
            background: #1F1F1F;
            color: white;
            user-select: none;
        }

        .titlebar-title {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .titlebar-icon {
            width: 16px;
            height: 16px;
            filter: invert(100%);
        }

        .titlebar-button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 30px;
            height: 30px;
        }

        .titlebar-button:hover {
            background: #3b3b3b;
        }

        .titlebar-button#close:hover {
            background: #da3d3d;
        }

        .titlebar-button img {
            filter: invert(100%);
        }
    </style>
</head>

<body>
    <!-- The whole bar drags, including the icon and the title inside it. The
         window control buttons opt out, so they stay clickable. -->
    <div class="titlebar" data-drag-region>
        <div class="titlebar-title">
            <img class="titlebar-icon"
                src="https://api.iconify.design/codicon:window.svg" />
            <span>Hello, World!</span>
        </div>
        <div data-no-drag-region>
            <div class="titlebar-button" onclick="window.dry.minimize()">
                <img
                    src="https://api.iconify.design/codicon:chrome-minimize.svg" />
            </div>
            <div class="titlebar-button" onclick="window.dry.toggleMaximize()">
                <img id="maximize-icon"
                    src="https://api.iconify.design/codicon:chrome-maximize.svg" />
            </div>
            <div class="titlebar-button" id="close" onclick="window.dry.close()">
                <img src="https://api.iconify.design/codicon:close.svg" />
            </div>
        </div>
    </div>
    <main>
        <p id="geometry"></p>
    </main>

    <script>
        // The titlebar does not keep its own guess at whether the window is
        // maximised. It listens, so a double-click on the bar, an OS keyboard
        // shortcut and the button below all leave it showing the same thing.
        const icon = document.getElementById('maximize-icon');
        const codicon = (name) =>
            `https://api.iconify.design/codicon:${name}.svg`;

        window.dry.on('window:maximized', () => {
            icon.src = codicon('chrome-restore');
        });
        window.dry.on('window:unmaximized', () => {
            icon.src = codicon('chrome-maximize');
        });

        // Sizes are logical pixels, the same unit `size=` is given, so these
        // are the numbers CSS is working in.
        const geometry = document.getElementById('geometry');
        const state = { width: '?', height: '?', x: '?', y: '?' };
        const show = () => {
            geometry.textContent =
                `${state.width} x ${state.height} at ${state.x}, ${state.y}`;
        };
        window.dry.on('window:resized', (size) => {
            Object.assign(state, size);
            show();
        });
        window.dry.on('window:moved', (position) => {
            Object.assign(state, position);
            show();
        });
        show();
    </script>
</body>

</html>
