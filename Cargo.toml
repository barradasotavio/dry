[package]
name = "dry-webview"
version = "0.3.2"
edition = "2024"

[lib]
name = "dry"
crate-type = ["cdylib"]

[dependencies]
wry = "0.56"
image = { version = "0.25", default-features = false, features = ["ico"] }
tao = { version = "0.36", default-features = false, features = [
    "rwh_06",
    "serde",
] }
pyo3 = { version = "0.29", default-features = false, features = [
    # ADR-0003: one stable-ABI wheel per platform, floor at Python 3.14.
    "abi3-py314",
    "extension-module",
    "macros",
] }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.140", default-features = false, features = [
    "alloc",
] }

[build-dependencies]
pyo3-build-config = "0.29"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"
